<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>داشبورد ادمین</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #eef2f5; }
    .card { border: none; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .nav-tabs .nav-link { font-weight: 500; }
    table { background: #fff; border-radius: .5rem; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary py-3">
    <div class="container">
      <a class="navbar-brand h4" href="#">
        <i class="bi bi-shield-lock"></i> پنل ادمین
      </a>
      <button id="logout" class="btn btn-outline-light ms-auto">
        <i class="bi bi-box-arrow-right"></i> خروج
      </button>
    </div>
  </nav>

  <main class="container my-4">
    <!-- تب‌ها -->
    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="profile-tab" data-bs-toggle="tab"
                data-bs-target="#profile" type="button" role="tab">
          <i class="bi bi-person-circle"></i> پروفایل
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="students-tab" data-bs-toggle="tab"
                data-bs-target="#students" type="button" role="tab">
          <i class="bi bi-people"></i> دانشجویان
        </button>
      </li>
    </ul>

    <div class="tab-content" id="adminTabsContent">
      <!-- پروفایل -->
      <div class="tab-pane fade show active" id="profile" role="tabpanel">
        <div id="alert-container"></div>
        <div class="card p-4 mb-4 text-center">
          <i class="bi bi-person-up fs-1 text-primary"></i>
          <h4 id="admin-name" class="mt-3">نام ادمین</h4>
          <p id="admin-phone" class="text-muted">شماره تلفن</p>
        </div>
      </div>

      <!-- نمایش دانشجویان -->
      <div class="tab-pane fade" id="students" role="tabpanel">
        <div id="students-alert"></div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>نام</th>
                <th>نام خانوادگی</th>
                <th>شماره تلفن</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <!-- JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiBase = 'http://85.198.9.71:8000';
    const token   = sessionStorage.getItem('session_token');
    if (!token) return window.location.href = 'login.html';

    // خروج
    document.getElementById('logout').onclick = () => {
      sessionStorage.removeItem('session_token');
      window.location.href = 'login.html';
    };

    // نمایش پیام
    function showAlert(containerId, msg, type='success') {
      document.getElementById(containerId).innerHTML = 
        `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
           ${msg}
           <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
         </div>`;
    }

    // دریافت اطلاعات ادمین
    function fetchAdmin() {
      fetch(`${apiBase}/me?token=${token}`)
        .then(res => res.json())
        .then(data => {
          if (data.role !== 'admin') throw new Error();
          document.getElementById('admin-name').textContent =
            data.first_name + ' ' + data.last_name;
          document.getElementById('admin-phone').textContent =
            data.phone_number;
        })
        .catch(() => {
          sessionStorage.removeItem('session_token');
          window.location.href = 'login.html';
        });
    }

    // دریافت و نمایش لیست دانشجویان
    function fetchStudents() {
      fetch(`${apiBase}/admin/students?token=${token}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('students-table-body');
          tbody.innerHTML = '';
          if (data.error) {
            showAlert('students-alert', data.error, 'danger');
            return;
          }
          data.forEach((s, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${i+1}</td>
              <td>${s.first_name}</td>
              <td>${s.last_name}</td>
              <td>${s.phone}</td>`;
            tbody.appendChild(tr);
          });
        })
        .catch(() => {
          showAlert('students-alert','خطا در بارگذاری دانشجویان.','danger');
        });
    }

    // وقتی تب «دانشجویان» فعال شد، لیست را بارگذاری کن
    document.getElementById('students-tab')
      .addEventListener('shown.bs.tab', fetchStudents);

    document.addEventListener('DOMContentLoaded', () => {
      fetchAdmin();
    });
  </script>
</body>
</html>
