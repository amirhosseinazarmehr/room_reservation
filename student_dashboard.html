<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>داشبورد دانشجو</title>
  <!-- Bootstrap 5 CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; }
    .card { border: none; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .list-group-item { border: none; border-radius: .5rem; margin-bottom: .5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    #slots-list .list-group-item { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <!-- Navbar + Profile Edit Toggle -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand h4"><i class="bi bi-speedometer2"></i> پنل دانشجو</span>
      <div>
        <button class="btn btn-outline-light me-2" data-bs-toggle="collapse" data-bs-target="#editProfile">
          <i class="bi bi-pencil-square"></i> ویرایش پروفایل
        </button>
        <button id="logout" class="btn btn-outline-light">
          <i class="bi bi-box-arrow-right"></i> خروج
        </button>
      </div>
    </div>
  </nav>

  <!-- Edit Profile Collapse -->
  <div class="collapse" id="editProfile">
    <div class="container py-3">
      <div class="card">
        <div class="card-header bg-white">
          <i class="bi bi-person-gear"></i> ویرایش اطلاعات
        </div>
        <div class="card-body">
          <form id="updateForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="update-first" class="form-label">نام</label>
                <input type="text" id="update-first" class="form-control">
              </div>
              <div class="col-md-6">
                <label for="update-last" class="form-label">نام خانوادگی</label>
                <input type="text" id="update-last" class="form-control">
              </div>
              <div class="col-md-6">
                <label for="update-identifier" class="form-label">کد دانشجویی</label>
                <input type="text" id="update-identifier" class="form-control">
              </div>
              <div class="col-md-6">
                <label for="update-phone" class="form-label">شماره تلفن</label>
                <input type="text" id="update-phone" class="form-control">
              </div>
              <div class="col-12">
                <label for="update-email" class="form-label">ایمیل</label>
                <input type="email" id="update-email" class="form-control">
              </div>
            </div>
            <div class="text-end mt-3">
              <button type="submit" class="btn btn-success">
                <i class="bi bi-save2"></i> ذخیره تغییرات
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <main class="container my-4">
    <!-- Alert container -->
    <div id="alert-container"></div>

    <!-- Welcome -->
    <div id="welcome" class="alert alert-success rounded-pill text-center shadow-sm">
      سلام دانشجو! خوش آمدید.
    </div>

    <!-- Info Card -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row text-center">
          <div class="col">
            <i class="bi bi-person-circle fs-3 text-primary"></i>
            <h5 id="name" class="mt-2">نام و نام خانوادگی</h5>
          </div>
          <div class="col">
            <i class="bi bi-card-text fs-3 text-primary"></i>
            <h6 class="mt-2">کد دانشجویی:</h6>
            <p id="identifier" class="mb-0">———</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Previous Reservations -->
    <div class="card mb-4">
      <div class="card-header bg-white">
        <i class="bi bi-bookmarks"></i> رزروهای شما
      </div>
      <ul id="reservations-list" class="list-group list-group-flush p-3">
        <!-- JS fills this -->
      </ul>
    </div>

    <!-- New Reservation -->
    <div class="card mb-5">
      <div class="card-header bg-white">
        <i class="bi bi-calendar-plus"></i> رزرو جدید
      </div>
      <div class="card-body">
        <div class="input-group mb-3">
          <input type="date" id="reservation-date" class="form-control">
          <button id="load-slots" class="btn btn-primary">
            <i class="bi bi-arrow-clockwise"></i> بارگذاری تایم‌ها
          </button>
        </div>
        <ul id="slots-list" class="list-group">
          <!-- JS fills this -->
        </ul>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiBase = 'http://85.198.9.71:8000';
    const token   = sessionStorage.getItem('session_token');
    if (!token) window.location.href = 'login.html';

    let studentId;

    // Logout
    document.getElementById('logout').onclick = () => {
      sessionStorage.removeItem('session_token');
      window.location.href = 'login.html';
    };

    // Alert helper
    function showAlert(msg, type = 'success') {
      document.getElementById('alert-container').innerHTML = 
        `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
           ${msg}
           <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
         </div>`;
    }

    // Fetch user & initialize dashboard
    function fetchUser() {
      fetch(`${apiBase}/me?token=${token}`)
        .then(res => {
          if (!res.ok) throw new Error();
          return res.json();
        })
        .then(data => {
          if (data.role !== 'student') throw new Error();
          // Welcome
          document.getElementById('welcome').textContent =
            `سلام ${data.first_name} عزیز! خوش آمدید.`;
          // Info display
          document.getElementById('name').textContent =
            `${data.first_name} ${data.last_name}`;
          document.getElementById('identifier').textContent =
            data.student_identifier;
          // Fill edit-form defaults
          document.getElementById('update-first').value = data.first_name;
          document.getElementById('update-last').value  = data.last_name;
          document.getElementById('update-identifier').value = data.student_identifier;
          document.getElementById('update-phone').value = data.phone_number;
          document.getElementById('update-email').value = data.email;
          // Reservations
          studentId = data.student_id;
          populateReservations(data.reservations);
        })
        .catch(() => {
          sessionStorage.removeItem('session_token');
          window.location.href = 'login.html';
        });
    }

    // Populate previous reservations
    function populateReservations(resArr) {
      const ul = document.getElementById('reservations-list');
      ul.innerHTML = '';
      if (!resArr || !resArr.length) {
        ul.innerHTML = `
          <li class="list-group-item text-center text-muted">
            شما تاکنون رزروی ثبت نکرده‌اید.
          </li>`;
        return;
      }
      resArr.forEach(r => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between';
        li.innerHTML = `<span><i class="bi bi-clock-history"></i> ${r.reserved_at}</span>`;
        ul.appendChild(li);
      });
    }

    // Day-of-week helper
    function getDayName(d) {
      return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(d).getDay()];
    }

    // Load slots
    document.getElementById('load-slots').onclick = () => {
      const dateVal = document.getElementById('reservation-date').value;
      if (!dateVal) return showAlert('لطفاً یک تاریخ انتخاب کنید.', 'warning');
      fetch(`${apiBase}/available-slots?day_of_week=${getDayName(dateVal)}&date=${dateVal}`)
        .then(res => res.json())
        .then(data => {
          const slotsUl = document.getElementById('slots-list');
          slotsUl.innerHTML = '';
          if (data.error) return showAlert(data.error, 'danger');
          if (!data.available_slots.length) {
            slotsUl.innerHTML = `<li class="list-group-item text-center text-muted">تایمی موجود نیست.</li>`;
            return;
          }
          data.available_slots.forEach(slot => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.innerHTML = `
              <span><i class="bi bi-clock"></i> ${slot.start.slice(11)} تا ${slot.end.slice(11)}</span>
              <button class="btn btn-sm btn-success"><i class="bi bi-check2-circle"></i> رزرو</button>`;
            li.querySelector('button').onclick = () => bookSlot(slot.start, li);
            slotsUl.appendChild(li);
          });
        })
        .catch(() => showAlert('خطا در دریافت تایم‌های آزاد.', 'danger'));
    };

    // Book slot
    function bookSlot(at, li) {
      fetch(`${apiBase}/student/book-slot`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ student_id: studentId, reserved_at: at })
      })
      .then(r=>r.json())
      .then(data=>{
        if (data.error) return showAlert(data.error, 'danger');
        showAlert(data.message, 'success');
        li.remove();
        // append to reservations
        const ul = document.getElementById('reservations-list');
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between';
        item.innerHTML = `<span><i class="bi bi-clock-history"></i> ${at}</span>`;
        ul.appendChild(item);
      })
      .catch(()=>showAlert('خطا در رزرو تایم.', 'danger'));
    }

    // Update profile
    document.getElementById('updateForm').onsubmit = e => {
      e.preventDefault();
      const payload = { token };
      ['first','last','identifier','phone','email'].forEach(field=>{
        const val = document.getElementById(`update-${field}`).value.trim();
        if (val) {
          const key = field==='first'?'first_name'
                    :field==='last'?'last_name'
                    :field==='identifier'?'student_identifier'
                    :field==='phone'?'phone_number'
                    :'email';
          payload[key] = val;
        }
      });
      fetch(`${apiBase}/student/update`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      })
      .then(r=>r.json())
      .then(data=>{
        if (data.error) return showAlert(data.error,'danger');
        showAlert('پروفایل با موفقیت به‌روز شد.', 'success');
        // بروزرسانی نمایش نام و کد
        document.getElementById('name').textContent =
          document.getElementById('update-first').value + ' ' +
          document.getElementById('update-last').value;
        document.getElementById('identifier').textContent =
          document.getElementById('update-identifier').value;
      })
      .catch(()=>showAlert('خطا در ارتباط با سرور.', 'danger'));
    };

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('reservation-date').valueAsDate = new Date();
      fetchUser();
    });
  </script>
</body>
</html>
