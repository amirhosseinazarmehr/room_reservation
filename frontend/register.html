<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم ثبت نام دانشجو</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .container { max-width: 500px; }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center">فرم ثبت نام دانشجو</h2>
    <div id="alertPlaceholder"></div>
    <form id="studentForm" novalidate>
      <!-- First Name -->
      <div class="mb-3">
        <label for="first_name" class="form-label">نام</label>
        <input type="text" class="form-control" id="first_name" required>
        <div class="invalid-feedback">لطفاً نام را وارد کنید.</div>
      </div>
      <!-- Last Name -->
      <div class="mb-3">
        <label for="last_name" class="form-label">نام خانوادگی</label>
        <input type="text" class="form-control" id="last_name" required>
        <div class="invalid-feedback">لطفاً نام خانوادگی را وارد کنید.</div>
      </div>
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">ایمیل</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">لطفاً ایمیل معتبر وارد کنید.</div>
      </div>
      <!-- Phone Number -->
      <div class="mb-3">
        <label for="phone_number" class="form-label">شماره تلفن</label>
        <input type="text" class="form-control" id="phone_number" required>
        <div class="invalid-feedback">شماره تلفن باید 10 یا 11 رقم باشد و ممکن است با 0 شروع شود.</div>
      </div>
      <!-- Student Identifier -->
      <div class="mb-3">
        <label for="student_identifier" class="form-label">کد دانشجویی</label>
        <input type="text" class="form-control" id="student_identifier" required>
        <div class="invalid-feedback">کد دانشجویی باید دقیقاً 12 کاراکتر باشد.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">ثبت نام</button>
    </form>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('studentForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const alertPlaceholder = document.getElementById('alertPlaceholder');
      alertPlaceholder.innerHTML = '';

      // Reset validation
      [...form.elements].forEach(el => {
        el.classList.remove('is-invalid');
      });

      // Collect values
      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone_number = document.getElementById('phone_number').value.trim();
      const student_identifier = document.getElementById('student_identifier').value.trim();

      // Patterns
      const phonePattern = /^0?\d{10}$/;
      const emailPattern = /^[\w.-]+@[\w.-]+\.\w+$/;

      let hasError = false;

      // Field validations
      if (!first_name) {
        document.getElementById('first_name').classList.add('is-invalid'); hasError = true;
      }
      if (!last_name) {
        document.getElementById('last_name').classList.add('is-invalid'); hasError = true;
      }
      if (!emailPattern.test(email)) {
        document.getElementById('email').classList.add('is-invalid'); hasError = true;
      }
      if (!phonePattern.test(phone_number)) {
        document.getElementById('phone_number').classList.add('is-invalid'); hasError = true;
      }
      if (student_identifier.length !== 12) {
        document.getElementById('student_identifier').classList.add('is-invalid'); hasError = true;
      }
      if (hasError) return;

      try {
        const response = await fetch('http://85.198.9.71:8000/student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ first_name, last_name, email, phone_number, student_identifier })
        });
        const result = await response.json();

        if (response.ok) {
          alertPlaceholder.innerHTML = `<div class="alert alert-success alert-dismissible fade show" role="alert">
            ثبت نام موفقیت‌آمیز بود!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن"></button>
          </div>`;
          form.reset();
        } else {
          const err = result.error || 'مشکلی رخ داد.';
          // Duplicate key handling
          const dup = err.match(/Duplicate entry .* for key '(.+)'/);
          if (dup) {
            const field = dup[1];
            const el = document.getElementById(field);
            if (el) {
              el.classList.add('is-invalid');
              const msgMap = {
                'phone_number': 'این شماره تلفن قبلاً ثبت شده است.',
                'student_identifier': 'این کد دانشجویی قبلاً ثبت شده است.',
                'email': 'این ایمیل قبلاً ثبت شده است.'
              };
              el.nextElementSibling.textContent = msgMap[field] || 'این مقدار قبلاً ثبت شده است.';
              return;
            }
          }
          // General error alert
          alertPlaceholder.innerHTML = `<div class="alert alert-danger alert-dismissible fade show" role="alert">
            خطا: ${err}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن"></button>
          </div>`;
        }
      } catch (err) {
        alertPlaceholder.innerHTML = `<div class="alert alert-danger alert-dismissible fade show" role="alert">
          ارتباط با سرور برقرار نشد.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن"></button>
        </div>`;
      }
    });
  </script>
</body>
</html>
